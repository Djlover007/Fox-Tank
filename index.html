<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fox Tank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app shell. Header, scrolling main area, bottom navigation. Sheets slide up from the bottom. */
:root{
  --bg:#f7f5f2; --surface:#ffffff; --surface2:#efebe6; --fg:#17130f; --muted:#6f685f; --line:#e6e0d9;
  --accent:#e8640c; --accent-ink:#ffffff; --accent-soft:#fde6d4;
  --green:#14a37f; --green-soft:#d9f2ea; --brand:#111114; --good:#178a5a; --good-soft:#dcf3e6; --bad:#d0342c; --bad-soft:#fbe3e1;
  --shadow:rgba(40,24,10,.14);
  --font-display:'Bricolage Grotesque','Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0f;--surface:#18181d;--surface2:#232329;--fg:#f4f4f6;--muted:#a4a4ae;--line:#2b2b32;
    --accent:#ff7a1a;--accent-ink:#1b0c02;--accent-soft:rgba(255,122,26,.16);
    --green:#2cc79c;--green-soft:rgba(44,199,156,.15);--good:#4cd08f;--good-soft:rgba(76,208,143,.14);--bad:#ff6f61;--bad-soft:rgba(255,111,97,.14);
    --shadow:rgba(0,0,0,.55);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0f;--surface:#18181d;--surface2:#232329;--fg:#f4f4f6;--muted:#a4a4ae;--line:#2b2b32;
  --accent:#ff7a1a;--accent-ink:#1b0c02;--accent-soft:rgba(255,122,26,.16);
  --green:#2cc79c;--green-soft:rgba(44,199,156,.15);--good:#4cd08f;--good-soft:rgba(76,208,143,.14);--bad:#ff6f61;--bad-soft:rgba(255,111,97,.14);
  --shadow:rgba(0,0,0,.55);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--font-body);
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Kopf */
.head{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;flex:none}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column}
.brand b{font:800 25px/1.05 var(--font-display);letter-spacing:-.02em}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.brand small span{color:var(--accent);font-weight:700}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg)}
.ib:active{background:var(--surface2)}

main{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 24px;-webkit-overflow-scrolling:touch}
.view{display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto}
h2{font:700 22px/1.2 var(--font-display);margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;margin:0}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}

/* Bausteine */
.box{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.grn{background:var(--green);color:#fff}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn svg.i{width:18px;height:18px}
select,input[type=text],input[type=password],textarea{width:100%;border:0;border-radius:12px;background:var(--surface2);padding:12px 14px;color:var(--fg)}
select{height:46px;padding:0 12px;font-weight:600}
textarea{min-height:84px;resize:none;font-size:18px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{white-space:nowrap;flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip.add{border-style:dashed;color:var(--muted)}

.prog{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.empty{text-align:center;color:var(--muted);padding:28px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:64px;height:64px}

/* Navigation unten */
.bnav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted)}
.bnav button .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.bnav button[aria-current="page"]{color:var(--fg)}
.bnav button[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
.bnav .badge{position:absolute;margin:-16px 0 0 24px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* Blatt von unten */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;gap:12px}
.sheet.open{transform:none}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-bottom:4px}
.sheet h3{font:700 21px/1.2 var(--font-display);margin:0}
.srow{background:var(--surface);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.srow.line{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.srow small{color:var(--muted);font-size:13.5px}
.sw{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--accent)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:13px 16px;border-radius:14px;font-size:15px;box-shadow:0 8px 24px var(--shadow);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;max-width:560px;margin:0 auto}
.toast.on{opacity:1;transform:none}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);transition:opacity .45s ease,visibility 0s .45s}
#splash.hide{opacity:0;visibility:hidden}
#splash .sp-logo{width:104px;height:104px;border-radius:30px;display:grid;place-items:center;background:var(--brand);box-shadow:0 14px 34px var(--shadow);animation:spPop .6s cubic-bezier(.2,.9,.3,1.3) both}
#splash .sp-logo svg{width:74px;height:74px}
#splash b{font:800 32px/1.1 var(--font-display);letter-spacing:-.02em;margin-top:8px;animation:spUp .5s .15s ease both}
#splash small{font-size:14px;color:var(--muted);letter-spacing:.06em;animation:spUp .5s .3s ease both}
#splash small span{color:var(--accent);font-weight:700}
@keyframes spPop{from{transform:scale(.6);opacity:0}}
@keyframes spUp{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* Fox Tank */
.logo,#splash .sp-logo{box-shadow:inset 0 0 0 1px var(--line)}
.bnav{grid-template-columns:repeat(4,1fr)}
.demo{background:var(--accent-soft);color:var(--fg);border-radius:16px;padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:center}
.demo b{color:var(--accent)}
.demo .btn{flex:none}
.where{display:flex;gap:10px;align-items:center}
.where .pin{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.where .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.where .tx b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.where .tx small{color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:700;font-size:14.5px;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px var(--shadow)}
.best{background:var(--brand);color:#fff;border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer}
.best .bp{font:800 40px/1 var(--font-display);letter-spacing:-.02em;color:#ffb067}
.best .bp sup{font-size:.5em;vertical-align:.75em;margin-left:1px}
.best .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.best .tx small{color:#c9c3bb;font-size:13px}
.best .tx b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.best .kl{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#ffb067}
.sl{display:flex;flex-direction:column;gap:8px}
.st{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 6px 10px 12px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.st.closed{opacity:.55}
.pbox{min-width:86px;text-align:center;border-radius:14px;padding:8px 6px;background:var(--surface2);flex:none}
.pbox .p{font:800 23px/1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pbox .p sup{font-size:.55em;vertical-align:.7em;margin-left:1px}
.pbox small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:3px}
.pbox.lo{background:var(--good-soft)}.pbox.lo .p{color:var(--good)}
.pbox.mid{background:#fff3d6}.pbox.mid .p{color:#a66b00}
.pbox.hi{background:var(--bad-soft)}.pbox.hi .p{color:var(--bad)}
@media (prefers-color-scheme:dark){.pbox.mid{background:rgba(255,190,60,.14)}.pbox.mid .p{color:#ffc35a}}
.st .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.st .tx b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15.5px}
.st .tx small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .tx .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.dot.off{background:var(--bad)}
.ib.star{width:42px;height:42px}
.ib.star.on{color:#e8a10c}
.ib.star.on svg{fill:#e8a10c}
#map{height:calc(100vh - 330px);min-height:300px;border-radius:20px;overflow:hidden;background:var(--surface2);z-index:0}
.mk{background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:10px;font:800 13px/1 var(--font-body);padding:5px 6px;white-space:nowrap;box-shadow:0 2px 6px var(--shadow);text-align:center;transform:translate(-50%,-100%);position:absolute;left:0;top:0}
.mk.lo{border-color:var(--good);color:var(--good)}
.mk.hi{border-color:var(--bad);color:var(--bad)}
.mk.mid{border-color:#e0a100;color:#a66b00}
.mk.off{opacity:.55}
.mk::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-color:inherit;border-bottom:0}
.me{width:18px;height:18px;border-radius:50%;background:#2f7ff5;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,127,245,.25)}
.leaflet-container{font-family:var(--font-body)}
.prices3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prices3 div{background:var(--surface);border-radius:16px;padding:12px 6px;text-align:center}
.prices3 div.on{outline:2px solid var(--accent)}
.prices3 small{display:block;color:var(--muted);font-size:12.5px;font-weight:700}
.prices3 b{font:800 24px/1.2 var(--font-display)}
.prices3 b sup{font-size:.55em;vertical-align:.7em}
.otimes{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.otimes span:nth-child(odd){color:var(--muted)}
.fav{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:18px;padding:12px;box-shadow:0 1px 0 var(--line);cursor:pointer}
.fav .top{display:flex;gap:10px;align-items:center}
.fav .top .tx{flex:1;min-width:0}
.fav .top .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav .top .tx small{color:var(--muted);font-size:13px}
.fav .f3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fav .f3 div{background:var(--surface2);border-radius:12px;padding:7px 4px;text-align:center}
.fav .f3 div.on{background:var(--accent-soft)}
.fav .f3 small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.fav .f3 b{font:800 18px/1.15 var(--font-display);font-variant-numeric:tabular-nums}
.fav .f3 b sup{font-size:.55em;vertical-align:.7em}
.fav .f3 .low b{color:var(--good)}
.step{display:flex;align-items:center;gap:10px;justify-content:center}
.step .val{font:800 44px/1 var(--font-display);min-width:150px;text-align:center;letter-spacing:-.02em}
.step .val sup{font-size:.5em;vertical-align:.8em}
.step button{width:54px;height:54px;border-radius:50%;border:0;background:var(--surface2);font:800 26px/1 var(--font-body)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.stat small{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.stat b{font:800 24px/1.2 var(--font-display);letter-spacing:-.01em}
.stat b i{font-style:normal;font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px;padding-top:18px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .bv{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.bars .b{width:100%;max-width:38px;background:var(--accent);border-radius:8px 8px 3px 3px;min-height:3px}
.bars .bc.now .b{background:var(--accent)}
.bars .bc:not(.now) .b{opacity:.55}
.bars .bl{font-size:12px;font-weight:700;color:var(--muted)}
.en{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 12px;cursor:pointer}
.en .dt{width:48px;text-align:center;flex:none;background:var(--surface2);border-radius:12px;padding:6px 0;line-height:1.1}
.en .dt b{display:block;font:800 18px/1.1 var(--font-display)}
.en .dt small{font-size:11px;font-weight:700;color:var(--muted)}
.en .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.en .tx b{font-size:15px}
.en .tx small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.en .sum{font:800 18px/1 var(--font-display);text-align:right}
.en .sum small{display:block;font:600 12px/1.3 var(--font-body);color:var(--good)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.fg label.full{grid-column:1/-1}
.fg input{width:100%;border:0;border-radius:12px;background:var(--surface2);padding:12px 14px;color:var(--fg);font-size:17px;font-weight:600}
.status{display:flex;gap:10px;align-items:center;font-size:14px}
.status .dot{width:10px;height:10px}
.src{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 0}
.src a{color:var(--muted)}
.res{display:flex;flex-direction:column;gap:6px}
.res button{border:0;text-align:left;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:15px}
.res button small{display:block;color:var(--muted);font-size:12.5px}
.sheet.open~.toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}
.avg{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 14px;box-shadow:0 1px 0 var(--line);font-size:14px}
.avg .tx{flex:1;min-width:0}
.avg .tx small{display:block;color:var(--muted);font-size:12px}
.avg .v{font:800 22px/1 var(--font-display);letter-spacing:-.01em}
.avg .v sup{font-size:.55em;vertical-align:.7em}
.avg .d{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
.avg .d.lo{background:var(--good-soft);color:var(--good)}
.avg .d.hi{background:var(--bad-soft);color:var(--bad)}
.fab{position:sticky;bottom:6px;align-self:center;box-shadow:0 8px 22px var(--shadow)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="fox" viewBox="0 0 112 108">
      <polygon fill="#F57C1F" points="12,10 38,30 62,30 88,10 93,50 50,93 7,50"/><polygon fill="#FFF1DC" points="7,50 38,60 50,93"/><polygon fill="#FFF1DC" points="93,50 62,60 50,93"/><polygon fill="#D65C0C" points="17,19 31,31 18,42"/><polygon fill="#D65C0C" points="83,19 69,31 82,42"/><polygon fill="#2A1608" points="30,47 42,52 31,54"/><polygon fill="#2A1608" points="70,47 58,52 69,54"/><polygon fill="#2A1608" points="43,81 57,81 50,93"/>
      <circle cx="83" cy="83" r="21" fill="#fff"/><circle cx="83" cy="83" r="18" fill="#F57C1F"/><polygon fill="#fff" points="83,70 75.5,84 90.5,84"/><circle cx="83" cy="86" r="7.5" fill="#fff"/>
    </symbol>
    <symbol id="i-pump" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M7 7h5v4H7z"/><path d="M15 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>

<script>
'use strict';
/* ================= Grundlagen ================= */
var REPO='__REPO__';
var API='https://creativecommons.tankerkoenig.de/json/';
var DEMO='00000000-0000-0000-0000-000000000002';
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ic(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>';}
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var set=Object.assign({key:'',fuel:'e10',rad:5,sort:'price',view:'list',autoUpd:true,place:null},load('ft-set',{}));
var favs=load('ft-favs',[]);
var alarm=Object.assign({on:false,limit:0,favs:true,area:false,home:null,rad:5,interval:30,quiet:true},load('ft-alarm',{}));
var book=load('ft-book',[]);
var favPrices=load('ft-favp',null);
var tab='near', pos=null, near=null, busy=false, lastErr='', mapObj=null, mapLayer=null;
function saveSet(){save('ft-set',set);}
function saveFavs(){save('ft-favs',favs);}
function saveAlarm(){save('ft-alarm',alarm);}
function saveBook(){book.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:(b.km||0)-(a.km||0);});save('ft-book',book);}

var tT;function toast(m,ms){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('on');},ms||3800);}
function isNative(){try{return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());}catch(e){return false;}}
function plug(name){
  if(!isNative())return null;
  try{return (Capacitor.Plugins&&Capacitor.Plugins[name])||Capacitor.registerPlugin(name);}catch(e){return null;}
}
var T=plug('Tank');
function errText(e){return String((e&&e.message)||e||'Unbekannter Fehler');}
function isDemo(){return !set.key;}
function key(){return set.key||DEMO;}
var FUEL={e5:'Super E5',e10:'Super E10',diesel:'Diesel'};
var FUELS=['e5','e10','diesel'];
function n(v){return typeof v==='number'&&isFinite(v)&&v>0;}
/* Preis wie an der Tankstelle: 1,73⁹ */
function pr(p){if(!n(p))return '–';var s=p.toFixed(3).replace('.',',');return s.slice(0,-1)+'<sup>'+s.slice(-1)+'</sup>';}
function eur(v,d){return (v||0).toLocaleString('de-DE',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})+' €';}
function num(v,d){return (v||0).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});}
function km(d){return d<1?Math.round(d*1000)+' m':num(d,1)+' km';}
function ago(t){var s=Math.round((Date.now()-t)/1000);if(s<60)return 'gerade eben';if(s<3600)return 'vor '+Math.round(s/60)+' Min.';if(s<86400)return 'vor '+Math.round(s/3600)+' Std.';return new Date(t).toLocaleDateString('de-DE');}
function title(s){var b=String(s.brand||'').trim(),nm=String(s.name||'').trim();return b||nm||'Tankstelle';}
function addr(s){return [String(s.street||'').trim()+' '+String(s.houseNumber||'').trim(),String(s.place||'').trim()].map(function(x){return x.trim();}).filter(Boolean).join(', ');}
var SMALL={an:1,am:1,der:1,die:1,das:1,dem:1,den:1,im:1,in:1,bei:1,ob:1,vor:1,zum:1,zur:1,von:1,und:1,auf:1,unter:1,ob:1};
function titleCase(s){var w=0;return String(s||'').toLowerCase().replace(/(^|[\s\-.(\/])([a-zäöüß]+)/g,function(m,a,b){w++;return a+(w>1&&a===' '&&SMALL[b]?b:b.charAt(0).toUpperCase()+b.slice(1));});}

/* Abruf: in der App über Java (kein CORS), im Browser normal */
async function getText(url){
  if(T){var r=await T.get({url:url});return r.body;}
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort();},15000);
  try{var res=await fetch(url,{signal:ctl.signal});if(!res.ok)throw new Error('HTTP '+res.status);return await res.text();}
  finally{clearTimeout(t);}
}
async function api(path,params){
  var q=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k]);}).join('&');
  var j;try{j=JSON.parse(await getText(API+path+'?'+q+'&apikey='+encodeURIComponent(key())));}
  catch(e){if(/^HTTP|fetch|network|timeout|abort/i.test(errText(e)))throw new Error('Keine Verbindung zu Tankerkönig. Bist du online?');throw e;}
  if(!j||!j.ok){var m=String((j&&j.message)||'Unbekannter Fehler');
    if(/apikey|api-key|key/i.test(m))m='Der API-Schlüssel stimmt nicht. Prüf ihn in den Einstellungen.';
    throw new Error(m);}
  return j;
}

/* ================= Deutschland-Durchschnitt (benzinpreis-aktuell.de, ohne Schlüssel) ================= */
var avg=load('ft-avg',null),avgBusy=false;
async function loadAvg(){
  if(avgBusy||(avg&&Date.now()-avg.at<10*60000))return;
  avgBusy=true;
  try{
    var j=JSON.parse(await getText('https://www.benzinpreis-aktuell.de/api.v2.php?data=nationwide'));
    var a={at:Date.now(),date:String(j.date||''),e5:parseFloat(j.super),e10:parseFloat(j.e10),diesel:parseFloat(j.diesel)};
    if(n(a.e5)||n(a.e10)||n(a.diesel)){avg=a;save('ft-avg',avg);if(tab==='near'||tab==='fav'||tab==='alarm')render();}
  }catch(e){}
  avgBusy=false;
}
function avgStand(){
  var m=String(avg.date).match(/(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/);if(!m)return '';
  var d=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]),today=new Date();
  return 'Stand '+(d.toDateString()===today.toDateString()?'heute':d.toLocaleDateString('de-DE'))+', '+m[4]+':'+m[5]+' Uhr';
}
/* cmp: Preis zum Vergleichen (z. B. günstigster in der Nähe) */
function avgBox(cmp){
  if(!avg||!n(avg[set.fuel]))return '';
  var a=avg[set.fuel],d='';
  if(n(cmp)){var c=Math.round((cmp-a)*100);d=c<0?'<span class="d lo">'+(-c)+' Cent günstiger</span>':c>0?'<span class="d hi">'+c+' Cent teurer</span>':'<span class="d">wie Schnitt</span>';}
  return '<div class="avg"><div class="tx"><small>Ø Deutschland · '+FUEL[set.fuel]+'</small><span class="v">'+pr(a)+'</span></div>'+(d?'<div style="text-align:right"><small style="display:block;color:var(--muted);font-size:12px;margin-bottom:3px">'+(isDemo()?'Beispiel':'Günstigste hier')+'</small>'+d+'</div>':'<small style="color:var(--muted);font-size:12px;text-align:right">'+esc(avgStand())+'<br>benzinpreis-aktuell.de</small>')+'</div>';
}

/* ================= Standort ================= */
function geoBrowser(){return new Promise(function(ok,no){
  if(!navigator.geolocation){no(new Error('kein GPS'));return;}
  navigator.geolocation.getCurrentPosition(function(p){ok({lat:p.coords.latitude,lng:p.coords.longitude});},function(e){no(new Error(e&&e.code===1?'permission':'Kein Standort'));},{enableHighAccuracy:false,timeout:12000,maximumAge:300000});
});}
async function locate(){
  try{return await geoBrowser();}
  catch(e){
    if(!T)throw e;
    try{return await T.locate();}
    catch(e2){
      if(/permission/i.test(errText(e2))){
        await new Promise(function(r){setTimeout(r,4000);});
        return await T.locate();
      }
      throw e2;
    }
  }
}
async function usePos(force){
  if(set.place&&!force){pos={lat:set.place.lat,lng:set.place.lng,name:set.place.name};return;}
  var p=await locate();
  pos={lat:p.lat,lng:p.lng,name:'Mein Standort'};
  set.place=null;saveSet();
  save('ft-lastpos',{lat:p.lat,lng:p.lng,t:Date.now()});
}

/* ================= Preise in der Nähe ================= */
async function loadNear(force){
  if(busy)return;
  if(!force&&near&&pos&&near.lat===pos.lat&&near.lng===pos.lng&&near.fuel===set.fuel&&near.rad===set.rad&&Date.now()-near.at<60000){render();return;}
  if(force&&near&&Date.now()-near.at<60000&&near.fuel===set.fuel&&near.rad===set.rad&&pos&&near.lat===pos.lat){toast('Die Preise sind von gerade eben. Neu laden geht in '+Math.ceil((60000-(Date.now()-near.at))/1000)+' Sek.');return;}
  busy=true;lastErr='';render();
  try{
    if(!pos)await usePos(false);
    var j=await api('list.php',{lat:pos.lat.toFixed(5),lng:pos.lng.toFixed(5),rad:set.rad,sort:'dist',type:'all'});
    near={at:Date.now(),lat:pos.lat,lng:pos.lng,fuel:set.fuel,rad:set.rad,stations:(j.stations||[]).map(function(s){
      return {id:s.id,name:titleCase(s.name),brand:String(s.brand||'').trim(),street:titleCase(s.street),houseNumber:s.houseNumber,postCode:s.postCode,place:titleCase(s.place),lat:s.lat,lng:s.lng,dist:s.dist,e5:s.e5,e10:s.e10,diesel:s.diesel,isOpen:s.isOpen};
    })};
    save('ft-near',near);
  }catch(e){
    var m=errText(e);
    lastErr=/permission/i.test(m)?'Fox Tank darf deinen Standort nicht sehen. Erlaube den Standort oder such einen Ort aus.':m;
  }
  busy=false;render();
}
function sorted(){
  if(!near)return [];
  var f=set.fuel,l=near.stations.slice();
  if(set.sort==='price')l.sort(function(a,b){var pa=n(a[f])&&a.isOpen?a[f]:99,pb=n(b[f])&&b.isOpen?b[f]:99;return pa-pb||a.dist-b.dist;});
  else l.sort(function(a,b){return a.dist-b.dist;});
  return l;
}
function range(list){
  var f=set.fuel,ps=list.filter(function(s){return s.isOpen&&n(s[f]);}).map(function(s){return s[f];});
  if(!ps.length)return null;return {min:Math.min.apply(null,ps),max:Math.max.apply(null,ps)};
}
function lvl(p,r){if(!n(p)||!r)return '';if(p<=r.min+0.02)return 'lo';if(p>=r.max-0.02&&r.max-r.min>0.04)return 'hi';return 'mid';}
function isFav(id){return favs.some(function(f){return f.id===id;});}
function stRow(s,r){
  var f=set.fuel,p=s[f];
  return '<div class="st'+(s.isOpen?'':' closed')+'" data-act="station" data-id="'+esc(s.id)+'">'+
    '<div class="pbox '+(s.isOpen?lvl(p,r):'')+'"><div class="p">'+pr(p)+'</div><small>'+FUEL[f]+'</small></div>'+
    '<div class="tx"><b>'+esc(title(s))+'</b><small>'+esc(addr(s))+'</small>'+
    '<span class="meta"><span class="dot'+(s.isOpen?'':' off')+'"></span>'+(s.isOpen?'Geöffnet':'Geschlossen')+' · '+km(s.dist)+'</span></div>'+
    '<button class="ib star'+(isFav(s.id)?' on':'')+'" data-act="fav" data-id="'+esc(s.id)+'" aria-label="Favorit">'+ic('star')+'</button></div>';
}
function demoBox(){
  return isDemo()?'<div class="demo"><div><b>Tankstellen = Beispieldaten.</b> Der Deutschland-Schnitt ist echt. Für echte Preise in deiner Nähe brauchst du einen kostenlosen Schlüssel von Tankerkönig.</div><button class="btn sm pri" data-act="keyhelp">Einrichten</button></div>':'';
}
function chip(act,k,txt,on){return '<button class="chip" data-act="'+act+'" data-k="'+k+'" aria-pressed="'+on+'">'+txt+'</button>';}
function viewNear(){
  var h=demoBox();
  h+='<div class="box"><div class="where"><div class="pin">'+ic(set.place?'pin':'loc')+'</div><div class="tx"><b>'+esc(pos?pos.name:(set.place?set.place.name:'Standort wird gesucht'))+'</b><small>Umkreis '+set.rad+' km'+(near?' · '+ago(near.at):'')+'</small></div>'+
    '<button class="ib" data-act="locate" aria-label="Mein Standort">'+ic('loc')+'</button><button class="ib" data-act="placesearch" aria-label="Ort suchen">'+ic('search')+'</button></div>'+
    '<div class="seg">'+FUELS.map(function(k){return '<button data-act="fuel" data-k="'+k+'" aria-pressed="'+(set.fuel===k)+'">'+FUEL[k]+'</button>';}).join('')+'</div>'+
    '<div class="row" style="justify-content:space-between"><div class="chips">'+[2,5,10,25].map(function(r){return chip('rad',r,r+' km',set.rad===r);}).join('')+'</div></div>'+
    '<div class="row" style="justify-content:space-between"><div class="chips">'+chip('sort','price','Günstigste',set.sort==='price')+chip('sort','dist','Nächste',set.sort==='dist')+'</div>'+
    '<div class="row"><button class="ib" data-act="view" aria-label="'+(set.view==='map'?'Liste':'Karte')+'">'+ic(set.view==='map'?'list':'map')+'</button><button class="ib" data-act="refresh" aria-label="Neu laden">'+(busy?'<span class="spin"></span>':ic('refresh'))+'</button></div></div></div>';
  if(lastErr)h+='<div class="err">'+esc(lastErr)+'</div>';
  if(!near){
    h+=avgBox(null);
    h+=busy?'<div class="empty"><span class="spin"></span>Preise werden geladen …</div>':
      '<div class="empty"><svg viewBox="0 0 112 108"><use href="#fox"/></svg><b>Wo willst du tanken?</b><div class="row" style="justify-content:center"><button class="btn pri" data-act="locate">'+ic('loc')+'Mein Standort</button><button class="btn" data-act="placesearch">'+ic('search')+'Ort suchen</button></div></div>';
    return h;
  }
  var l=sorted(),r=range(l),f=set.fuel;
  var cheap=l.filter(function(s){return s.isOpen&&n(s[f]);}).sort(function(a,b){return a[f]-b[f]||a.dist-b.dist;})[0];
  if(cheap)h+='<div class="best" data-act="station" data-id="'+esc(cheap.id)+'"><div class="bp">'+pr(cheap[f])+'</div><div class="tx"><span class="kl">Am günstigsten</span><b>'+esc(title(cheap))+'</b><small>'+esc(addr(cheap))+' · '+km(cheap.dist)+'</small></div></div>';
  h+=avgBox(cheap?cheap[f]:null);
  if(set.view==='map'){h+='<div id="map"></div>';}
  else if(!l.length)h+='<div class="empty">Keine Tankstelle im Umkreis von '+set.rad+' km. Nimm einen größeren Umkreis.</div>';
  else h+='<div class="sl">'+l.map(function(s){return stRow(s,r);}).join('')+'</div>';
  h+='<p class="src">Preise: <a href="#" data-act="ext" data-u="https://www.tankerkoenig.de">Tankerkönig</a> (MTS-K), CC BY 4.0 · Ø Deutschland: <a href="#" data-act="ext" data-u="https://www.benzinpreis-aktuell.de">benzinpreis-aktuell.de</a>'+(set.view==='map'?' · Karte © OpenStreetMap, © CARTO':'')+'</p>';
  return h;
}

/* ---------- Karte ---------- */
var LL=null;
function loadLeaflet(){
  if(window.L&&L.map)return Promise.resolve();
  if(LL)return LL;
  LL=new Promise(function(ok,no){
    var c=document.createElement('link');c.rel='stylesheet';c.href='leaflet/leaflet.css';document.head.appendChild(c);
    var s=document.createElement('script');s.src='leaflet/leaflet.js';s.onload=function(){ok();};s.onerror=function(){LL=null;no(new Error('Karte konnte nicht geladen werden'));};document.head.appendChild(s);
  });
  return LL;
}
function dark(){var t=document.documentElement.getAttribute('data-theme');return t==='dark'||(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}
async function drawMap(){
  var el=$('#map');if(!el||!near)return;
  try{await loadLeaflet();}catch(e){el.innerHTML='<div class="empty">'+esc(errText(e))+'</div>';return;}
  el=$('#map');if(!el)return;
  if(mapObj){try{mapObj.remove();}catch(e){}mapObj=null;}
  mapObj=L.map(el,{zoomControl:false,attributionControl:false}).setView([near.lat,near.lng],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/'+(dark()?'dark_all':'voyager')+'/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd'}).addTo(mapObj);
  L.marker([near.lat,near.lng],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false}).addTo(mapObj);
  var f=set.fuel,l=near.stations,r=range(l),pts=[[near.lat,near.lng]];
  l.forEach(function(s){
    var cls=s.isOpen?lvl(s[f],r):'off';
    var m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:'<div class="mk '+cls+'">'+pr(s[f])+'</div>',iconSize:[0,0]})}).addTo(mapObj);
    m.on('click',function(){stationSheet(s.id);});
    pts.push([s.lat,s.lng]);
  });
  if(pts.length>1)mapObj.fitBounds(pts,{padding:[30,30],maxZoom:15});
}

/* ---------- Tankstelle ---------- */
function findSt(id){
  var s=near&&near.stations.filter(function(x){return x.id===id;})[0];
  if(s)return s;
  var f=favs.filter(function(x){return x.id===id;})[0];
  if(!f)return null;
  var p=favPrices&&favPrices.prices&&favPrices.prices[id]||{};
  return Object.assign({},f,{e5:p.e5,e10:p.e10,diesel:p.diesel,isOpen:p.status==='open'});
}
var DAYS={};
async function stationSheet(id){
  var s=findSt(id);if(!s)return;
  function body(d){

/* ================= Tankbuch ================= */
function stats(){
  var e=book.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.km||0)-(b.km||0);});
  var tot=0,lit=0,cons=[],lastFull=null,acc=0;
  e.forEach(function(x){
    tot+=x.t||0;lit+=x.l||0;
    if(x.km){
      if(lastFull){acc+=x.l||0;}
      if(x.full){
        if(lastFull&&x.km>lastFull.km){cons.push({d:x.d,km:x.km-lastFull.km,l:acc});}
        lastFull=x;acc=0;
      }
    }
  });
  var dk=0,dl=0;cons.forEach(function(c){dk+=c.km;dl+=c.l;});
  return {tot:tot,lit:lit,avgP:lit?tot/lit:0,cons:dk?dl/dk*100:0,last:cons.length?cons[cons.length-1].l/cons[cons.length-1].km*100:0,n:e.length};
}
function months(){
  var now=new Date(),out=[];
  for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');out.push({k:k,lab:d.toLocaleDateString('de-DE',{month:'short'}).replace('.',''),v:0});}
  book.forEach(function(x){var k=String(x.d).slice(0,7);out.forEach(function(m){if(m.k===k)m.v+=x.t||0;});});
  return out;
}
function viewBook(){
  var h='<div class="row" style="justify-content:space-between"><h2>Tankbuch</h2><button class="btn sm pri" data-act="newentry">'+ic('plus')+'Eintragen</button></div>';
  if(!book.length)return h+'<div class="empty"><svg class="i"><use href="#i-book"/></svg><b>Noch nichts eingetragen</b>Trag nach dem Tanken Liter, Preis und Kilometerstand ein. Fox Tank rechnet dir Verbrauch und Kosten aus.<button class="btn pri" data-act="newentry">'+ic('plus')+'Erste Tankfüllung</button></div>';
  var s=stats(),m=months(),mx=Math.max.apply(null,m.map(function(x){return x.v;}))||1,cur=m[m.length-1];
  h+='<div class="stat">'+
    '<div><small>Ø Verbrauch</small><b>'+(s.cons?num(s.cons,1):'–')+'<i>l/100 km</i></b></div>'+
    '<div><small>Diesen Monat</small><b>'+eur(cur.v)+'</b></div>'+
    '<div><small>Ø Literpreis</small><b>'+(s.avgP?num(s.avgP,3):'–')+'<i>€</i></b></div>'+
    '<div><small>Gesamt ('+s.n+'×)</small><b>'+eur(s.tot,0)+'</b></div></div>';
  if(!s.cons)h+='<p class="hint">Für den Verbrauch: zweimal voll tanken und jeweils den Kilometerstand eintragen.</p>';
  h+='<div class="box"><p class="lbl" style="margin:0">Kosten pro Monat</p><div class="bars">'+m.map(function(x,i){return '<div class="bc'+(i===m.length-1?' now':'')+'"><span class="bv">'+(x.v?Math.round(x.v)+' €':'')+'</span><div class="b" style="height:'+Math.round(x.v/mx*90)+'%"></div><span class="bl">'+esc(x.lab)+'</span></div>';}).join('')+'</div></div>';
  h+='<div class="sl">'+book.map(function(x,i){
    var d=new Date(x.d+'T12:00:00');
    return '<div class="en" data-act="editentry" data-i="'+i+'"><div class="dt"><b>'+d.getDate()+'</b><small>'+d.toLocaleDateString('de-DE',{month:'short'}).replace('.','')+'</small></div>'+
      '<div class="tx"><b>'+num(x.l,2)+' l '+(x.f?FUEL[x.f]:'')+(x.full?' · voll':'')+'</b><small>'+(x.p?num(x.p,3)+' €/l':'')+(x.km?' · '+x.km.toLocaleString('de-DE')+' km':'')+(x.st?' · '+esc(x.st):'')+'</small></div>'+
      '<div class="sum">'+eur(x.t)+'</div></div>';
  }).join('')+'</div>';
  return h;
}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pnum(v){v=String(v||'').trim().replace(/\s/g,'');if(v.indexOf(',')>=0)v=v.replace(/\./g,'').replace(',','.');var x=parseFloat(v);return isFinite(x)?x:0;}
function fnum(v,d){return v?String(Number(v).toFixed(d)).replace('.',','):'';}
var editI=-1;
function entrySheet(i,pre){
  editI=i;var x=i>=0?book[i]:Object.assign({d:todayStr(),l:0,p:0,t:0,km:0,full:true,f:set.fuel,st:''},pre||{});
  var lastKm=book.reduce(function(m,y){return Math.max(m,y.km||0);},0);
  openSheet('<h3>'+(i>=0?'Tankfüllung ändern':'Tankfüllung eintragen')+'</h3>'+
    '<div class="seg" id="eF">'+FUELS.map(function(k){return '<button data-act="efuel" data-k="'+k+'" aria-pressed="'+(x.f===k)+'">'+FUEL[k]+'</button>';}).join('')+'</div>'+
    '<div class="fg">'+
    '<label>Liter<input id="eL" inputmode="decimal" value="'+fnum(x.l,2)+'" placeholder="z. B. 45,30"></label>'+
    '<label>Preis pro Liter<input id="eP" inputmode="decimal" value="'+fnum(x.p,3)+'" placeholder="1,739"></label>'+
    '<label>Betrag in €<input id="eT" inputmode="decimal" value="'+fnum(x.t,2)+'" placeholder="wird ausgerechnet"></label>'+
    '<label>Datum<input id="eD" type="date" value="'+esc(x.d)+'"></label>'+
    '<label class="full">Kilometerstand<input id="eK" inputmode="numeric" value="'+(x.km||'')+'" placeholder="'+(lastKm?'zuletzt '+lastKm.toLocaleString('de-DE'):'z. B. 123456')+'"></label>'+
    '<label class="full">Tankstelle<input id="eS" value="'+esc(x.st)+'" placeholder="optional"></label></div>'+
    '<div class="srow line"><div><b>Voll getankt</b><br><small>Nur dann kann der Verbrauch genau berechnet werden</small></div><input type="checkbox" class="sw" id="eFull"'+(x.full?' checked':'')+' aria-label="Voll getankt"></div>'+
    '<button class="btn pri wide" data-act="saveentry">Speichern</button>'+
    (i>=0?'<button class="btn wide" data-act="delentry" style="color:var(--bad)">'+ic('trash')+'Löschen</button>':'<button class="btn wide" data-act="close">Abbrechen</button>'));
  $('#sheet').dataset.ef=x.f;
  var L1=$('#eL'),P1=$('#eP'),T1=$('#eT'),lastEdit='';
  function calc(src){var l=pnum(L1.value),p=pnum(P1.value),t=pnum(T1.value);
    if(src!=='t'&&l&&p)T1.value=fnum(l*p,2);
    else if(src==='t'&&t&&p&&!l)L1.value=fnum(t/p,2);
    else if(src==='t'&&t&&l)P1.value=fnum(t/l,3);}
  L1.addEventListener('input',function(){calc('l');});P1.addEventListener('input',function(){calc('p');});T1.addEventListener('input',function(){calc('t');});
}
function saveEntry(){
  var x={d:$('#eD').value||todayStr(),l:pnum($('#eL').value),p:pnum($('#eP').value),t:pnum($('#eT').value),km:Math.round(pnum($('#eK').value)),full:$('#eFull').checked,f:$('#sheet').dataset.ef||set.fuel,st:$('#eS').value.trim()};
  if(!x.l&&x.t&&x.p)x.l=Math.round(x.t/x.p*100)/100;
  if(!x.t&&x.l&&x.p)x.t=Math.round(x.l*x.p*100)/100;
  if(!x.p&&x.l&&x.t)x.p=Math.round(x.t/x.l*1000)/1000;
  if(!x.l||!x.t){toast('Bitte mindestens Liter und Preis (oder Betrag) eintragen.');return;}
  if(editI>=0)book[editI]=x;else book.push(x);
  saveBook();closeSheet();toast(editI>=0?'Geändert.':'Eingetragen ✓');if(tab!=='book')go('book');else render();
}

  }
}

/* ================= Einstellungen ================= */
var appVer=null, upd=null, UPL=false;
function openSheet(html){var s=$('#sheet');s.innerHTML='<div class="grip"></div>'+html;s.classList.add('open');$('#scrim').classList.add('open');s.scrollTop=0;s.dataset.sid='';}
function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').classList.remove('open');}
$('#scrim').addEventListener('click',closeSheet);
async function loadVer(){var P=plug('Updater');if(!P||appVer)return;try{var i=await P.info();appVer={code:Number(i.versionCode),name:String(i.versionName||'')};}catch(e){}}
function openExt(u){var P=plug('Updater');if(P)P.openUrl({url:u}).catch(function(){toast('Keine App zum Öffnen gefunden.');});else window.open(u,'_blank');}
function keyHelp(){
  openSheet('<h3>Echte Preise einrichten</h3>'+
    '<div class="srow"><b>So geht’s (einmalig, kostenlos)</b><small>1. Auf <b>onboarding.tankerkoenig.de</b> mit Name und E-Mail registrieren.<br>2. Den Schlüssel aus der E-Mail kopieren (sieht aus wie <b>1a2b3c4d-…</b>).<br>3. Hier einfügen und speichern.</small>'+
    '<button class="btn sm" data-act="ext" data-u="https://onboarding.tankerkoenig.de">Registrierung öffnen</button></div>'+
    '<div class="srow"><b>Dein API-Schlüssel</b><input type="text" id="kIn" value="'+esc(set.key)+'" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off" autocapitalize="off" spellcheck="false"><small>Bleibt nur auf deinem Handy.</small></div>'+
    '<button class="btn pri wide" data-act="savekey">Speichern und prüfen</button>'+
    (set.key?'<button class="btn wide" data-act="delkey">Schlüssel löschen (Beispieldaten)</button>':''));
}
async function saveKey(){
  var k=($('#kIn').value||'').trim().toLowerCase();
  if(k&&!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(k)){toast('Der Schlüssel sieht nicht richtig aus. Er hat 36 Zeichen mit Bindestrichen.',5000);return;}
  var old=set.key;set.key=k;
  try{
    if(k){var p=pos||{lat:48.7,lng:9.45};await api('list.php',{lat:p.lat.toFixed(4),lng:p.lng.toFixed(4),rad:2,sort:'dist',type:'all'});}
    saveSet();closeSheet();toast(k?'Schlüssel funktioniert ✓ Jetzt siehst du echte Preise.':'Schlüssel gelöscht.');
    near=null;favPrices=null;syncAlarm();
    if(tab==='near')loadNear(false);else render();
  }catch(e){set.key=old;toast('Prüfung fehlgeschlagen: '+errText(e),6000);}
}
async function settingsSheet(){
  await loadVer();
  openSheet('<h3>Einstellungen</h3>'+
    '<button class="srow" style="border:0;text-align:left" data-act="keyhelp"><b>Tankerkönig-Schlüssel</b><small>'+(set.key?'Eingetragen ✓ ('+esc(set.key.slice(0,8))+'…)':'Fehlt – du siehst Beispieldaten')+'</small></button>'+
    '<div class="srow"><b>Spritsorte</b><div class="seg">'+FUELS.map(function(k){return '<button data-act="fuel" data-k="'+k+'" aria-pressed="'+(set.fuel===k)+'">'+FUEL[k]+'</button>';}).join('')+'</div></div>'+
    (isNative()?'<button class="srow" style="border:0;text-align:left" data-act="upd"><b>App-Update</b><small>'+(appVer?'Version '+appVer.code+' · ':'')+'Tippen zum Prüfen'+(upd?' · Neu: '+upd.ver:'')+'</small></button>'+
    '<div class="srow line"><div><b>Updates automatisch suchen</b><br><small>Die Installation bestätigst du selbst</small></div><input type="checkbox" class="sw" id="autoUpd"'+(set.autoUpd?' checked':'')+' aria-label="Updates automatisch suchen"></div>':'')+
    '<div class="srow"><b>Woher kommen die Preise?</b><small>Alle Tankstellen in Deutschland müssen ihre Preise an die Markttransparenzstelle für Kraftstoffe (MTS-K) melden. Fox Tank holt sie über Tankerkönig (Lizenz CC BY 4.0). Den Deutschland-Durchschnitt liefert benzinpreis-aktuell.de, dafür braucht es keinen Schlüssel. Die Preise können sich jederzeit ändern, an der Säule gilt der Preis dort.</small></div>'+
    '<div class="srow line"><div><b>Tankbuch löschen</b><br><small>'+book.length+' Einträge</small></div><button class="btn sm" data-act="clearbook">Löschen</button></div>'+
    '<p class="hint" style="text-align:center">Fox Tank · Design by <b style="color:var(--accent)">Mr.Fox</b></p>');
  var el=$('#autoUpd');if(el)el.addEventListener('change',function(e){set.autoUpd=e.target.checked;saveSet();});
}

/* ================= App-Update über GitHub ================= */
function mb(b){return (b/1048576).toFixed(1).replace('.',',')+' MB';}
async function checkUpdate(manual){
  var P=plug('Updater');if(!P)return;
  await loadVer();
  if(REPO.indexOf('__')===0){if(manual)toast('Diese Version kennt ihr GitHub-Repository nicht.');return;}
  if(manual)toast('Suche nach Updates …');
  try{
    var r=JSON.parse(await getText('https://api.github.com/repos/'+REPO+'/releases/latest'));
    var m=String(r.tag_name||'').match(/(\d+)\s*$/),ver=m?parseInt(m[1],10):0;
    var asset=(r.assets||[]).filter(function(a){return /\.apk$/i.test(a.name);})[0];
    if(!asset)throw new Error('keine APK im Release');
    if(appVer&&ver>appVer.code){
      upd={ver:ver,url:asset.browser_download_url,size:asset.size,done:false,notes:String(r.body||'').split(/\r?\n/).map(function(l){return l.replace(/^[\s*•-]+/,'').trim();}).filter(function(l){return l&&!/^(co-authored-by|claude-session)/i.test(l)&&!/^https?:/.test(l);})};
      updateSheet();
    }else if(manual)toast('Du hast die neueste Version ('+(appVer?appVer.code:'?')+').');
  }catch(e){if(manual)toast('Update-Prüfung fehlgeschlagen: '+errText(e).slice(0,100));}
}
function updateSheet(){
  var s=upd.size?' · '+mb(upd.size):'';
  openSheet('<h3>Neues Update bereit</h3><div class="srow"><b>Version '+upd.ver+'</b><small>Installiert: '+(appVer?appVer.code:'?')+s+'</small></div>'+
    '<div class="srow"><b>Was ist neu</b>'+(upd.notes.length?'<ul style="margin:0;padding-left:20px">'+upd.notes.slice(0,12).map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul>':'<small>Kleine Verbesserungen und Fehlerbehebungen</small>')+'</div>'+
    '<button class="btn pri wide" data-act="updgo">Jetzt aktualisieren</button><button class="btn wide" data-act="close">Später</button>');
}
async function doUpdate(){
  var P=plug('Updater');if(!P||!upd)return;
  if(!UPL){UPL=true;
    try{P.addListener('progress',function(e){var a=$('#updP'),b=$('#updB'),p=(e&&e.percent)||0;if(a)a.textContent='Lade … '+p+' %';if(b)b.style.width=p+'%';});}catch(x){}
    try{P.addListener('installResult',function(e){var st=e&&e.status,m=String((e&&e.message)||'');if(st===0)return;if(st===3){toast('Installation abgebrochen.');return;}
      var t=(st===7||st===5||/INCOMPATIBLE|signature|CONFLICT/i.test(m))?'Die Signatur passt nicht zur installierten App. Deinstalliere Fox Tank einmal und installiere die neueste Version von GitHub von Hand.':st===6?'Auf dem Handy ist zu wenig Speicher frei.':'Android hat die Installation abgelehnt.';
      openSheet('<h3>Installation fehlgeschlagen</h3><div class="srow"><small style="color:var(--fg)">'+esc(t)+'</small><small>Technisch: '+esc(m.slice(0,160)||('Code '+st))+'</small></div><button class="btn wide" data-act="close">OK</button>');});}catch(x){}
  }
  try{
    if(!upd.done){
      openSheet('<h3>Update wird geladen</h3><div class="srow"><b id="updP">Lade … 0 %</b><div class="prog"><i id="updB" style="width:0"></i></div></div>');
      await P.download({url:upd.url});upd.done=true;
    }
    closeSheet();await P.install();
  }catch(e){var m=errText(e);closeSheet();
    if(/permission/i.test(m))toast('Erlaube Fox Tank in den Einstellungen „Apps installieren“ und tippe danach nochmal auf App-Update.',6000);
    else toast('Update fehlgeschlagen: '+m.slice(0,200),6000);}
}

/* ================= Eingaben ================= */
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='pq'){e.preventDefault();placeSearch();}});
document.addEventListener('click',async function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,k=b.dataset.k,id=b.dataset.id;
  if(a==='fav'||a==='ext')e.preventDefault();
  if(a==='fav'){e.stopPropagation();toggleFav(id);return;}
  switch(a){
    case 'settings':settingsSheet();break;
    case 'close':closeSheet();break;
    case 'tab':go(k);break;
    case 'ext':openExt(b.dataset.u);break;
    case 'keyhelp':keyHelp();break;
    case 'savekey':saveKey();break;
    case 'delkey':$('#kIn').value='';saveKey();break;
    case 'fuel':set.fuel=k;saveSet();syncAlarm();if($('#sheet').classList.contains('open')&&!$('#sheet').dataset.sid){Array.prototype.forEach.call(document.querySelectorAll('#sheet [data-act="fuel"]'),function(x){x.setAttribute('aria-pressed',x.dataset.k===k);});}render();break;
    case 'rad':set.rad=+k;saveSet();loadNear(false);break;
    case 'sort':set.sort=k;saveSet();render();break;
    case 'view':set.view=set.view==='map'?'list':'map';saveSet();render();break;
    case 'refresh':loadNear(true);break;
    case 'locate':{toast('Suche deinen Standort …',2500);busy=true;render();try{await usePos(true);busy=false;near=null;loadNear(false);}catch(x){busy=false;var m=errText(x);lastErr=/permission/i.test(m)?'Fox Tank darf deinen Standort nicht sehen. Erlaube ihn in den Android-Einstellungen oder such einen Ort aus.':m;render();}break;}
    case 'placesearch':placeSheet('near');break;
    case 'pqgo':placeSearch();break;
    case 'pick':pickPlace(placeRes[+b.dataset.i]);break;
    case 'station':stationSheet(id);break;
    case 'navi':{var s=findSt(id);if(s)openExt('https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng);break;}
    case 'tanked':{var s2=findSt(id);closeSheet();setTimeout(function(){entrySheet(-1,{p:s2&&n(s2[set.fuel])?s2[set.fuel]:0,st:s2?title(s2)+(s2.street?', '+s2.street:''):''});},260);break;}
    case 'favref':favPrices&&Date.now()-favPrices.at>=60000?loadFavPrices(true):favPrices?toast('Die Preise sind von gerade eben.'):loadFavPrices(true);break;
    case 'lim':alarm.limit=Math.max(0.5,Math.round((alarm.limit+(+k)*0.01)*100)/100);saveAlarm();syncAlarm();render();break;
    case 'arad':alarm.rad=+k;saveAlarm();syncAlarm();render();break;
    case 'aint':alarm.interval=+k;saveAlarm();syncAlarm();render();break;
    case 'homehere':{try{toast('Suche deinen Standort …',2500);var p=await locate();alarm.home={lat:p.lat,lng:p.lng,name:'Standort vom '+new Date().toLocaleDateString('de-DE')};saveAlarm();syncAlarm();render();}catch(x){toast('Kein Standort: '+errText(x));}break;}
    case 'homesearch':placeSheet('home');break;
    case 'askn':if(T){try{await T.askNotify();}catch(x){}setTimeout(refreshAState,1500);}break;
    case 'testn':if(T){try{await T.testNotify();toast('Test-Nachricht gesendet.');}catch(x){toast(errText(x));}}break;
    case 'checknow':if(T){if(!alarm.on){toast('Schalte den Alarm zuerst an.');break;}await syncAlarm();try{await T.checkNow();toast('Wird geprüft … das Ergebnis steht gleich unter Status.');setTimeout(refreshAState,8000);}catch(x){}}break;
    case 'newentry':entrySheet(-1);break;
    case 'editentry':entrySheet(+b.dataset.i);break;
    case 'efuel':$('#sheet').dataset.ef=k;Array.prototype.forEach.call(document.querySelectorAll('#sheet [data-act="efuel"]'),function(x){x.setAttribute('aria-pressed',x.dataset.k===k);});break;
    case 'saveentry':saveEntry();break;
    case 'delentry':if(editI>=0){book.splice(editI,1);saveBook();closeSheet();toast('Gelöscht.');render();}break;
    case 'clearbook':if(b.dataset.sure){book=[];saveBook();closeSheet();render();toast('Tankbuch gelöscht.');}else{b.dataset.sure='1';b.textContent='Wirklich?';b.style.color='var(--bad)';}break;
    case 'upd':checkUpdate(true);break;
    case 'updgo':doUpdate();break;
  }
});

/* ================= Start ================= */
(function(){var t0=load('ft-tab','near');if(['near','fav','alarm','book'].indexOf(t0)>=0)tab=t0;Array.prototype.forEach.call(document.querySelectorAll('.bnav button'),function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});})();
(function(){
  var lp=load('ft-near',null);if(lp&&lp.stations){near=lp;}
  if(set.place)pos={lat:set.place.lat,lng:set.place.lng,name:set.place.name};
  else{var l=load('ft-lastpos',null);if(l)pos={lat:l.lat,lng:l.lng,name:'Mein Standort'};}
  if(near&&pos&&(near.lat!==pos.lat||near.lng!==pos.lng))near=null;
})();
render();
loadAvg();
setTimeout(function(){$('#splash').classList.add('hide');},900);
if(tab==='near'){
  if(set.place)loadNear(false);
  else{usePos(true).then(function(){if(near&&(near.lat!==pos.lat||near.lng!==pos.lng))near=null;loadNear(false);}).catch(function(e){if(!near){var m=errText(e);lastErr=/permission/i.test(m)?'Erlaube Fox Tank den Standort oder such einen Ort aus.':'';render();}});}
}else if(tab==='fav')loadFavPrices(false);
else if(tab==='alarm')refreshAState();
document.addEventListener('visibilitychange',function(){if(document.hidden)return;loadAvg();if(tab==='alarm')refreshAState();});
if(alarm.on)syncAlarm();
if(isNative()&&set.autoUpd){
  var lastU=0;try{lastU=Number(localStorage.getItem('ft-upd-t')||0);}catch(e){}
  if(Date.now()-lastU>6*3600e3){try{localStorage.setItem('ft-upd-t',String(Date.now()));}catch(e){}setTimeout(function(){checkUpdate(false);},3000);}
}
</script>
